name: social_roots
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  
  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  
  # State Management
  flutter_riverpod: ^3.4.2
  
  # Contacts
  flutter_contacts: ^2.3.1
  permission_handler: ^13.0.1
  
  # Animation
  rive: ^0.13.20
  
  # UI/UX
  audioplayers: ^6.8.1
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.2
  url_launcher: ^6.2.2
  share_plus: ^13.3.0
  image_picker: ^1.0.7
  
  # Local Notifications
  flutter_local_notifications: ^22.3.0
  
  # Deep Linking
  shared_preferences: ^2.5.4
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # NOTE: isar_generator + build_runner were removed deliberately.
  # isar_generator is EOL and pins analyzer <6, which conflicts with
  # flutter_riverpod 3.x. The generated *.g.dart model files are committed,
  # so builds don't need the codegen tooling. To regenerate Isar models,
  # temporarily add back:
  #   isar_generator: ^3.1.0+1
  #   build_runner: ^2.4.13
  # then run: dart run build_runner build --delete-conflicting-outputs

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/audio/
  
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
