name: social_roots
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  
  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Contacts
  flutter_contacts: ^2.3.1
  permission_handler: ^13.0.1
  
  # Animation
  rive: ^0.13.20
  
  # UI/UX
  audioplayers: ^6.8.1
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.2
  url_launcher: ^6.2.2
  share_plus: ^13.3.0
  image_picker: ^1.0.7
  
  # Local Notifications
  flutter_local_notifications: ^20.0.0
  
  # Deep Linking
  shared_preferences: ^2.5.4
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation (Isar models)
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/audio/
  
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
